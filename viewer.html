<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>exgram — live diagram</title>
  <!-- Excalidraw styles -->
  <link rel="stylesheet" href="https://esm.sh/@excalidraw/excalidraw@0.18.0/dist/prod/index.css" />
  <link rel="icon" type="image/svg+xml" href="/assets/wordmark.svg" />
  <style>
    html, body, #app { margin: 0; height: 100%; width: 100%; }
    body { font-family: ui-sans-serif, system-ui, sans-serif; }
    #status {
      position: fixed; bottom: 14px; left: 14px; z-index: 9;
      background: rgba(30,30,30,.85); color: #fff; font-size: 12px;
      padding: 6px 10px; border-radius: 999px; display: flex; gap: 8px;
      align-items: center; pointer-events: none; user-select: none;
      box-shadow: 0 2px 8px rgba(0,0,0,.2);
    }
    #status .dot { width: 8px; height: 8px; border-radius: 50%; background: #51cf66; }
    /* save affordance (board edit mode only): explicit save + saved/dirty pill.
       Bottom-RIGHT so it never collides with the top-left chrome (#boardbar) the
       other branch is reworking, nor with the bottom-left #status pill. */
    #savebar {
      position: fixed; bottom: 14px; right: 14px; z-index: 9; display: none;
      gap: 8px; align-items: center; user-select: none;
    }
    #savebar #save-state {
      font-size: 12px; color: #fff; background: rgba(30,30,30,.85);
      padding: 6px 10px; border-radius: 999px; display: flex; gap: 8px; align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,.2);
    }
    #savebar #save-state .dot { width: 8px; height: 8px; border-radius: 50%; background: #51cf66; }
    #savebar #save-state.dirty .dot { background: #ffd43b; }
    #savebar #save-state.saving .dot { background: #4dabf7; }
    #savebar #save-state.error .dot { background: #ff6b6b; }
    #savebar button#save-now {
      font: inherit; font-size: 12px; line-height: 1; cursor: pointer;
      background: #1971c2; color: #fff; border: 1px solid #1971c2; border-radius: 8px;
      padding: 8px 12px; box-shadow: 0 1px 4px rgba(0,0,0,.12);
    }
    #savebar button#save-now:hover { background: #1864ab; }
    #status.stale .dot { background: #ff922b; }
    #status.error .dot { background: #ff6b6b; }
    #boot { position: fixed; inset: 0; display: grid; place-items: center; color: #868e96; }
    /* index landing (shown when no ?d= slug is given) */
    #index { max-width: 640px; margin: 64px auto; padding: 0 24px; color: #1e1e1e; }
    #index h1 { font-size: 22px; margin: 0 0 4px; }
    /* hand-drawn wordmark (dogfooded: drawn by exgram, exported to SVG) */
    #index h1.brand { margin: 0 0 6px; line-height: 0; }
    #index h1.brand img { height: 46px; width: auto; display: block; }
    #index p { color: #868e96; margin: 0 0 24px; }
    #index ul { list-style: none; padding: 0; margin: 0; }
    #index li { margin: 0 0 8px; display: flex; gap: 8px; align-items: stretch; }
    #index li a {
      flex: 1; padding: 12px 16px; border: 1px solid #dee2e6; border-radius: 10px;
      text-decoration: none; color: #1971c2; font-weight: 600;
    }
    #index li a:hover { background: #f1f3f5; }
    /* Icon-only row actions: square buttons keep each row tight (3 actions sit
       inline rather than behind an overflow menu — see issue #52). The glyph is
       the visual; `aria-label` + `title` carry the accessible name + tooltip. */
    #index button.act {
      font: inherit; cursor: pointer; color: #495057; background: #fff;
      border: 1px solid #dee2e6; border-radius: 10px; line-height: 1;
      width: 40px; display: inline-flex; align-items: center; justify-content: center;
      font-size: 16px;
    }
    #index button.act:hover { background: #f1f3f5; }
    #index button.del { color: #e03131; border-color: #ffc9c9; }
    #index button.del:hover { background: #fff5f5; }
    #index p.empty { color: #adb5bd; }
    /* per-board name + secondary meta line (created/edited times) */
    #index li a .name { display: block; }
    #index li a .meta {
      display: block; margin-top: 3px; font-size: 12px; font-weight: 400; color: #868e96;
    }
    #index li a .meta time { color: inherit; }
    /* sort control row, sits between the search box and the list */
    #index .sort {
      display: flex; align-items: center; gap: 6px; margin: 0 0 12px; flex-wrap: wrap;
      font-size: 13px; color: #868e96;
    }
    #index .sort button.sortkey {
      font: inherit; cursor: pointer; color: #495057; background: #fff;
      border: 1px solid #dee2e6; border-radius: 8px; padding: 4px 10px; line-height: 1.4;
    }
    #index .sort button.sortkey:hover { background: #f1f3f5; }
    #index .sort button.sortkey.active { color: #1971c2; border-color: #74c0fc; background: #e7f5ff; }
    #index .sort button.sortkey .arrow { color: #adb5bd; margin-left: 2px; }
    #index .sort button.sortkey.active .arrow { color: #1971c2; }
    /* "＋ New board" sits at the right end of the sort row, accented as a primary action. */
    #index .sort button.newboard {
      margin-left: auto; font: inherit; cursor: pointer; color: #1971c2; background: #e7f5ff;
      border: 1px solid #74c0fc; border-radius: 8px; padding: 4px 10px; line-height: 1.4;
      font-weight: 600;
    }
    #index .sort button.newboard:hover { background: #d0ebff; }
    /* on a narrow viewport, drop the "created …" segment of the meta line */
    @media (max-width: 480px) { #index li a .meta .created { display: none; } }
    /* search/filter box above the boards list */
    #index .search { position: relative; margin: 0 0 16px; }
    #index .search input {
      width: 100%; box-sizing: border-box; font: inherit; padding: 10px 36px 10px 14px;
      border: 1px solid #dee2e6; border-radius: 10px; color: #1e1e1e; outline: none;
    }
    #index .search input:focus { border-color: #74c0fc; box-shadow: 0 0 0 3px rgba(116,192,252,.25); }
    #index .search button.clear {
      position: absolute; top: 50%; right: 8px; transform: translateY(-50%);
      font: inherit; line-height: 1; cursor: pointer; color: #868e96; background: transparent;
      border: none; padding: 4px 8px; border-radius: 8px;
    }
    #index .search button.clear:hover { background: #f1f3f5; color: #495057; }
    #index p.noresults { color: #adb5bd; }
    /* board-view chrome: a spaced action pad (nav group | board actions) that
       clears Excalidraw's top-left hamburger. */
    #boardbar {
      position: fixed; top: 12px; left: 56px; z-index: 9; display: none;
      gap: 8px; align-items: center; padding: 6px;
      background: #fff; border: 1px solid #e9ecef; border-radius: 12px;
      box-shadow: 0 2px 10px rgba(0,0,0,.1);
    }
    #boardbar .group { display: flex; gap: 4px; align-items: center; }
    #boardbar a.brand { padding: 0 4px 0 2px; line-height: 0; }
    #boardbar a.brand img { height: 20px; width: auto; display: block; opacity: .9; }
    #boardbar a.brand:hover { background: transparent; }
    #boardbar .divider { width: 1px; align-self: stretch; margin: 2px 2px; background: #e9ecef; }
    #boardbar a, #boardbar button {
      font: inherit; font-size: 12px; line-height: 1; cursor: pointer; text-decoration: none;
      background: #fff; color: #495057; border: 1px solid transparent; border-radius: 8px;
      padding: 7px 10px; display: inline-flex; align-items: center; gap: 6px;
    }
    #boardbar a:hover, #boardbar button:hover { background: #f1f3f5; }
    #boardbar .ic { font-size: 13px; line-height: 1; }
    #boardbar button.del { color: #e03131; }
    #boardbar button.del:hover { background: #fff5f5; }
    /* styled confirm/destructive modal (replaces window.confirm) */
    #modal { position: fixed; inset: 0; z-index: 20; display: none; place-items: center;
      background: rgba(30,30,30,.4); }
    #modal.open { display: grid; }
    #modal .card {
      background: #fff; color: #1e1e1e; max-width: 380px; margin: 0 24px; padding: 22px 24px;
      border-radius: 14px; box-shadow: 0 12px 40px rgba(0,0,0,.25);
    }
    #modal .card p { margin: 0 0 20px; font-size: 15px; line-height: 1.45; }
    #modal .card .row { display: flex; justify-content: flex-end; gap: 10px; }
    #modal .card button {
      font: inherit; cursor: pointer; border-radius: 9px; padding: 9px 16px;
      border: 1px solid #dee2e6; background: #fff; color: #495057;
    }
    #modal .card button.cancel:hover { background: #f1f3f5; }
    #modal .card button.danger { background: #e03131; border-color: #e03131; color: #fff; font-weight: 600; }
    #modal .card button.danger:hover { background: #c92a2a; }
    /* 404 overlay: shown in board mode when the slug truly isn't on this server */
    #notfound {
      position: fixed; inset: 0; z-index: 8; overflow: auto; background: #fff;
    }
    #notfound .panel { max-width: 640px; margin: 64px auto; padding: 0 24px; color: #1e1e1e; }
    #notfound h1 { font-size: 22px; margin: 0 0 12px; }
    #notfound h1 .slug { color: #e8590c; }
    #notfound .meta { color: #868e96; margin: 0 0 8px; font-size: 14px; }
    #notfound .meta code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      background: #f1f3f5; padding: 2px 6px; border-radius: 6px; color: #1e1e1e; word-break: break-all;
    }
    #notfound h2 { font-size: 14px; color: #495057; margin: 24px 0 8px; }
    #notfound ul { list-style: none; padding: 0; margin: 0; }
    #notfound li { margin: 0 0 8px; }
    #notfound a.board {
      display: block; padding: 12px 16px; border: 1px solid #dee2e6; border-radius: 10px;
      text-decoration: none; color: #1971c2; font-weight: 600;
    }
    #notfound a.board:hover { background: #f1f3f5; }
    #notfound .empty { color: #adb5bd; }
    #notfound .hint { color: #adb5bd; margin: 24px 0 0; font-size: 13px; }
  </style>
  <script>
    // Where Excalidraw loads its fonts from. If this CDN path 404s, Excalidraw
    // silently falls back to system fonts and the diagram still renders.
    window.EXCALIDRAW_ASSET_PATH = 'https://esm.sh/@excalidraw/excalidraw@0.18.0/dist/prod/';
  </script>
</head>
<body>
  <div id="boot">Loading exgram viewer…</div>
  <div id="app"></div>
  <div id="index" hidden></div>
  <div id="notfound" hidden></div>
  <div id="boardbar">
    <a class="brand" href="/" title="exgram — all boards"><img src="/assets/wordmark.svg" alt="exgram" /></a>
    <div class="group">
      <a href="/" title="Back to all boards"><span class="ic">←</span> boards</a>
    </div>
    <div class="divider"></div>
    <div class="group">
      <button class="rename" type="button" title="Rename this board"><span class="ic">✎</span> Rename</button>
      <button class="dup" type="button" title="Duplicate this board"><span class="ic">⧉</span> Duplicate</button>
      <button class="edit" type="button" title="Toggle edit mode"><span class="ic">✏️</span> Edit</button>
      <button class="del" type="button" title="Delete this board"><span class="ic">🗑</span> Delete</button>
    </div>
  </div>
  <div id="modal"><div class="card"><p id="modal-text"></p><div class="row"><button class="cancel" type="button">Cancel</button><button class="danger" type="button">Delete</button></div></div></div>
  <div id="status" hidden><span class="dot"></span><span id="status-text">starting…</span></div>
  <div id="savebar"><span id="save-state"><span class="dot"></span><span id="save-state-text">saved</span></span><button id="save-now" type="button">Save</button></div>

  <script type="module">
    import React from 'https://esm.sh/react@18.3.1';
    import { createRoot } from 'https://esm.sh/react-dom@18.3.1/client';
    import { Excalidraw, restoreElements } from 'https://esm.sh/@excalidraw/excalidraw@0.18.0?deps=react@18.3.1,react-dom@18.3.1';

    const params = new URLSearchParams(location.search);
    const slug = params.get('d');
    const editMode = params.get('edit') === '1';
    const boot = document.getElementById('boot');

    // Same slug rule the server enforces (lib/serve.mjs SLUG). Keep these in sync.
    const SLUG_RE = /^[a-z0-9][a-z0-9_-]*$/i;

    // ---- shared styled confirm dialog (replaces window.confirm for deletes) ----
    // One modal, reused by both the index per-row delete and the board-view delete.
    const modal = document.getElementById('modal');
    const modalText = document.getElementById('modal-text');
    const modalCancel = modal.querySelector('button.cancel');
    const modalDanger = modal.querySelector('button.danger');
    let modalResolve = null;
    const closeModal = (val) => {
      modal.classList.remove('open');
      const r = modalResolve;
      modalResolve = null;
      if (r) r(val);
    };
    modalCancel.addEventListener('click', () => closeModal(false));
    modalDanger.addEventListener('click', () => closeModal(true));
    modal.addEventListener('click', (ev) => { if (ev.target === modal) closeModal(false); });
    document.addEventListener('keydown', (ev) => {
      if (ev.key === 'Escape' && modal.classList.contains('open')) closeModal(false);
    });
    // Resolves true if the user confirms the destructive action.
    const confirmDelete = (s) =>
      new Promise((resolve) => {
        modalText.textContent = `Delete board "${s}"? This removes its spec and render.`;
        modalResolve = resolve;
        modal.classList.add('open');
        modalDanger.focus();
      });

    // ---- shared rename flow: prompt for a new slug, validate, POST /api/rename.
    // Returns the new slug on success, or null if cancelled/failed (it alerts on
    // a real failure). `existing` is the list of slugs to check for duplicates.
    async function renameBoard(from, existing) {
      const known = new Set(existing || []);
      let to = (window.prompt(`Rename board "${from}" to:`, from) || '').trim();
      if (!to || to === from) return null; // cancelled or unchanged
      if (!SLUG_RE.test(to)) {
        alert('Invalid name. Use letters, digits, dashes or underscores (must start with a letter or digit).');
        return null;
      }
      if (known.has(to)) {
        alert(`A board named "${to}" already exists.`);
        return null;
      }
      try {
        const res = await fetch('/api/rename', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ from, to }),
        });
        if (!res.ok) {
          alert(res.status === 409 ? `A board named "${to}" already exists.` : `Rename failed (${res.status}).`);
          return null;
        }
        return to;
      } catch {
        alert('Rename failed: could not reach the server.');
        return null;
      }
    }

    // ---- shared duplicate flow: prompt for a new slug (default `<slug>-copy`),
    // validate, POST /api/duplicate. Returns the new slug on success, or null if
    // cancelled/failed (it alerts on a real failure). `existing` is the list of
    // slugs to check for duplicates. Mirrors renameBoard.
    async function duplicateBoard(from, existing) {
      const known = new Set(existing || []);
      // Default suggestion: `<slug>-copy`, then `-copy2`, `-copy3`… if taken.
      let suggestion = `${from}-copy`;
      for (let n = 2; known.has(suggestion); n++) suggestion = `${from}-copy${n}`;
      let to = (window.prompt(`Duplicate board "${from}" as:`, suggestion) || '').trim();
      if (!to) return null; // cancelled
      if (!SLUG_RE.test(to)) {
        alert('Invalid name. Use letters, digits, dashes or underscores (must start with a letter or digit).');
        return null;
      }
      if (to === from || known.has(to)) {
        alert(`A board named "${to}" already exists.`);
        return null;
      }
      try {
        const res = await fetch('/api/duplicate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ from, to }),
        });
        if (!res.ok) {
          alert(res.status === 409 ? `A board named "${to}" already exists.` : `Duplicate failed (${res.status}).`);
          return null;
        }
        return to;
      } catch {
        alert('Duplicate failed: could not reach the server.');
        return null;
      }
    }

    // Prompt for a slug, validate, POST /api/create; returns the new slug or null.
    async function createBoard(existing) {
      const known = new Set(existing || []);
      let to = (window.prompt('Name your new board:', '') || '').trim();
      if (!to) return null;
      if (!SLUG_RE.test(to)) {
        alert('Invalid name. Use letters, digits, dashes or underscores (must start with a letter or digit).');
        return null;
      }
      if (known.has(to)) {
        alert(`A board named "${to}" already exists.`);
        return null;
      }
      try {
        const res = await fetch('/api/create', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ slug: to }),
        });
        if (!res.ok) {
          alert(res.status === 409 ? `A board named "${to}" already exists.` : `Create failed (${res.status}).`);
          return null;
        }
        return to;
      } catch {
        alert('Create failed: could not reach the server.');
        return null;
      }
    }

    // ---- index mode: no ?d= -> list all live boards ----
    if (!slug) {
      boot.remove();
      // the empty #app is full-viewport-height and would push the list off-screen
      document.getElementById('app').style.display = 'none';
      const index = document.getElementById('index');
      index.hidden = false;
      const escapeHtml = (s) =>
        String(s).replace(/[&<>"']/g, (c) =>
          ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

      let allBoards = []; // last-known full list as { slug, created, updated }
      let query = '';      // the typed filter; preserved across auto-refreshes

      // Sort key + direction, persisted so the choice sticks across reloads.
      // Defaults: by last edited, descending (most recently edited first).
      const SORT_KEY = 'exgram:index-sort';
      const SORT_KEYS = ['updated', 'created', 'name'];
      let sort = { key: 'updated', dir: 'desc' };
      try {
        const saved = JSON.parse(localStorage.getItem(SORT_KEY) || 'null');
        if (saved && SORT_KEYS.includes(saved.key) && (saved.dir === 'asc' || saved.dir === 'desc')) {
          sort = { key: saved.key, dir: saved.dir };
        }
      } catch {}
      const persistSort = () => {
        try { localStorage.setItem(SORT_KEY, JSON.stringify(sort)); } catch {}
      };

      // --- relative / absolute time formatting (native Intl, no deps) ---
      const RTF = (() => {
        try { return new Intl.RelativeTimeFormat(undefined, { numeric: 'auto' }); } catch { return null; }
      })();
      const ABS_SAME_YEAR = (() => {
        try { return new Intl.DateTimeFormat(undefined, { month: 'short', day: 'numeric' }); } catch { return null; }
      })();
      const ABS_OTHER_YEAR = (() => {
        try { return new Intl.DateTimeFormat(undefined, { month: 'short', day: 'numeric', year: 'numeric' }); } catch { return null; }
      })();
      const FULL_DT = (() => {
        try { return new Intl.DateTimeFormat(undefined, { dateStyle: 'full', timeStyle: 'short' }); } catch { return null; }
      })();

      // A short human label for a timestamp (ms): relative within ~7 days, then
      // an absolute short date. Returns '' for null/invalid input.
      function relTime(ms) {
        if (ms == null || !isFinite(ms)) return '';
        const now = Date.now();
        const diff = ms - now;          // negative = in the past
        const absMs = Math.abs(diff);
        const SEC = 1000, MIN = 60 * SEC, HOUR = 60 * MIN, DAY = 24 * HOUR;
        if (RTF) {
          if (absMs < MIN) return RTF.format(0, 'second'); // "now"
          if (absMs < HOUR) return RTF.format(Math.round(diff / MIN), 'minute');
          if (absMs < DAY) return RTF.format(Math.round(diff / HOUR), 'hour');
          if (absMs < 7 * DAY) return RTF.format(Math.round(diff / DAY), 'day');
        }
        // Past ~7 days (or no Intl): absolute short date, with year if it differs.
        const d = new Date(ms);
        const sameYear = d.getFullYear() === new Date(now).getFullYear();
        const fmt = sameYear ? ABS_SAME_YEAR : ABS_OTHER_YEAR;
        return fmt ? fmt.format(d) : d.toISOString().slice(0, 10);
      }

      // A <time> element (HTML string) for a timestamp, or an em-dash when absent.
      function timeTag(ms) {
        if (ms == null || !isFinite(ms)) return '—';
        const d = new Date(ms);
        const title = FULL_DT ? FULL_DT.format(d) : d.toString();
        return `<time datetime="${escapeHtml(d.toISOString())}" title="${escapeHtml(title)}">${escapeHtml(relTime(ms))}</time>`;
      }

      // Order boards by the active sort. Null timestamps always sort LAST,
      // regardless of direction. Name uses a natural, case-insensitive compare.
      function sortBoards(list) {
        const dir = sort.dir === 'asc' ? 1 : -1;
        const arr = list.slice();
        if (sort.key === 'name') {
          arr.sort((a, b) =>
            dir * a.slug.localeCompare(b.slug, undefined, { numeric: true, sensitivity: 'base' }));
          return arr;
        }
        const field = sort.key === 'created' ? 'created' : 'updated';
        arr.sort((a, b) => {
          const av = a[field], bv = b[field];
          const aNull = av == null || !isFinite(av);
          const bNull = bv == null || !isFinite(bv);
          if (aNull && bNull) {
            // Stable tie-break by name so null rows have a deterministic order.
            return a.slug.localeCompare(b.slug, undefined, { numeric: true, sensitivity: 'base' });
          }
          if (aNull) return 1;  // a sorts after b (last)
          if (bNull) return -1; // b sorts after a (last)
          return dir * (av - bv);
        });
        return arr;
      }

      // Re-paint just the list portion, applying the current case-insensitive
      // filter and the active sort. Kept separate from the chrome so
      // re-rendering never disturbs the search input or the sort buttons.
      function renderList() {
        const listEl = document.getElementById('board-list');
        if (!listEl) return;
        const q = query.trim().toLowerCase();
        const filtered = q ? allBoards.filter((b) => b.slug.toLowerCase().includes(q)) : allBoards;
        const items = sortBoards(filtered);
        if (!allBoards.length) {
          listEl.innerHTML = '<p class="empty">No diagrams yet. Ask your agent to draw something.</p>';
          return;
        }
        listEl.innerHTML = items.length
          ? '<ul>' + items.map((b) => {
              const s = b.slug;
              const meta = `<span class="created">created ${timeTag(b.created)}</span> · ` +
                `<span class="edited">edited ${timeTag(b.updated)}</span>`;
              return `<li><a href="/?d=${encodeURIComponent(s)}">` +
                `<span class="name">${escapeHtml(s)}</span>` +
                `<span class="meta">${meta}</span></a>` +
                `<button class="act rename" type="button" title="Rename" aria-label="Rename ${escapeHtml(s)}" data-slug="${encodeURIComponent(s)}">✎</button>` +
                `<button class="act dup" type="button" title="Duplicate" aria-label="Duplicate ${escapeHtml(s)}" data-slug="${encodeURIComponent(s)}">⧉</button>` +
                `<button class="act del" type="button" title="Delete" aria-label="Delete ${escapeHtml(s)}" data-slug="${encodeURIComponent(s)}">🗑</button></li>`;
            }).join('') + '</ul>'
          : `<p class="noresults">No boards match "${escapeHtml(query.trim())}".</p>`;
      }

      // Repaint just the sort buttons' active state + direction arrows, without
      // disturbing the search input.
      const SORT_LABELS = { updated: 'Last edited', created: 'Created', name: 'Name' };
      function renderSort() {
        const bar = document.getElementById('board-sort');
        if (!bar) return;
        bar.querySelectorAll('button.sortkey').forEach((btn) => {
          const active = btn.dataset.key === sort.key;
          btn.classList.toggle('active', active);
          const arrow = btn.querySelector('.arrow');
          if (arrow) arrow.textContent = active ? (sort.dir === 'asc' ? '↑' : '↓') : '';
        });
      }

      // Build the static chrome (heading + search box + sort control) once; the
      // list lives in a child container that we repaint on every refresh.
      function renderChrome() {
        index.innerHTML =
          '<h1 class="brand"><img src="/assets/wordmark.svg" alt="exgram" width="200" /></h1>' +
          '<p>Your agent\'s diagrams, live and editable — open one or ask for a new one.</p>' +
          '<div class="search">' +
            '<input id="board-search" type="text" placeholder="Filter boards…" autocomplete="off" spellcheck="false" />' +
            '<button class="clear" type="button" title="Clear filter" hidden>×</button>' +
          '</div>' +
          '<div class="sort" id="board-sort">' +
            '<span>Sort:</span>' +
            SORT_KEYS.map((k) =>
              `<button class="sortkey" type="button" data-key="${k}">${SORT_LABELS[k]}<span class="arrow"></span></button>`).join('') +
            '<button class="newboard" type="button" title="Create a new blank board">＋ New board</button>' +
          '</div>' +
          '<div id="board-list"></div>';
        const input = document.getElementById('board-search');
        const clear = index.querySelector('.search button.clear');
        input.value = query;
        clear.hidden = !query;
        input.addEventListener('input', () => {
          query = input.value;
          clear.hidden = !query;
          renderList();
        });
        clear.addEventListener('click', () => {
          query = '';
          input.value = '';
          clear.hidden = true;
          input.focus();
          renderList();
        });
        // Sort buttons: clicking a key activates it; clicking the active key
        // toggles its direction. New keys default to descending (name -> asc).
        document.getElementById('board-sort').addEventListener('click', (ev) => {
          const btn = ev.target.closest('button.sortkey');
          if (!btn) return;
          const key = btn.dataset.key;
          if (key === sort.key) {
            sort.dir = sort.dir === 'asc' ? 'desc' : 'asc';
          } else {
            sort.key = key;
            sort.dir = key === 'name' ? 'asc' : 'desc';
          }
          persistSort();
          renderSort();
          renderList();
        });
        renderSort();
        input.focus(); // autofocus on load
      }

      async function refresh() {
        try {
          const data = await (await fetch('/api/diagrams', { cache: 'no-store' })).json();
          // Tolerate the legacy string-array shape just in case.
          allBoards = Array.isArray(data)
            ? data.map((d) => (typeof d === 'string'
                ? { slug: d, created: null, updated: null }
                : { slug: d.slug, created: d.created ?? null, updated: d.updated ?? null }))
            : [];
        } catch {}
        renderList();
      }

      // Per-row delete (styled confirm) and rename, event-delegated so they
      // survive the periodic re-render.
      index.addEventListener('click', async (ev) => {
        const newBtn = ev.target.closest('button.newboard');
        if (newBtn) {
          const to = await createBoard(allBoards.map((b) => b.slug));
          if (to) location.href = `/?d=${encodeURIComponent(to)}&edit=1`;
          return;
        }
        const renameBtn = ev.target.closest('button.rename');
        if (renameBtn) {
          const s = decodeURIComponent(renameBtn.dataset.slug);
          const to = await renameBoard(s, allBoards.map((b) => b.slug));
          if (to) await refresh();
          return;
        }
        const dupBtn = ev.target.closest('button.dup');
        if (dupBtn) {
          const s = decodeURIComponent(dupBtn.dataset.slug);
          const to = await duplicateBoard(s, allBoards.map((b) => b.slug));
          if (to) await refresh();
          return;
        }
        const delBtn = ev.target.closest('button.del');
        if (!delBtn) return;
        const s = decodeURIComponent(delBtn.dataset.slug);
        if (!(await confirmDelete(s))) return;
        try { await fetch(`/scene/${encodeURIComponent(s)}.excalidraw`, { method: 'DELETE' }); } catch {}
        await refresh();
      });

      // Type-ahead: start typing anywhere and the keystroke lands in the search
      // box. Bound once on document; we look up the (possibly re-created) input by
      // id at handle time so it keeps working across the 2s auto-refresh.
      document.addEventListener('keydown', (ev) => {
        const input = document.getElementById('board-search');
        if (!input) return;
        const active = document.activeElement;
        // Escape while focused in the search clears it (mirrors the clear button).
        if (ev.key === 'Escape' && active === input) {
          query = '';
          input.value = '';
          const clear = index.querySelector('.search button.clear');
          if (clear) clear.hidden = true;
          renderList();
          input.blur();
          return;
        }
        // Ignore when already typing in a field, or for modifier/non-printable keys.
        const tag = active && active.tagName;
        const inField = active && (tag === 'INPUT' || tag === 'TEXTAREA' || active.isContentEditable);
        if (inField) return;
        if (ev.key.length !== 1 || ev.ctrlKey || ev.metaKey || ev.altKey) return;
        // Take ownership of the first character. Focusing on keydown WITHOUT
        // preventDefault only re-routes the keystroke in Chromium; Firefox/Safari
        // resolve the key's text-insertion target before focus moves, dropping the
        // first letter. So we preventDefault, focus, and append the char ourselves,
        // mirroring the 'input' handler (query + value + clear button + re-render).
        ev.preventDefault();
        input.focus();
        query += ev.key;
        input.value = query;
        const clear = index.querySelector('.search button.clear');
        if (clear) clear.hidden = !query;
        renderList();
      });

      renderChrome();
      refresh();
      setInterval(refresh, 2000); // pick up newly created boards
    } else {
      // ---- board mode: render and watch one scene ----
      const statusEl = document.getElementById('status');
      const statusText = document.getElementById('status-text');
      statusEl.hidden = false;
      document.title = `exgram — ${slug}`;
      let api = null, lastText = '', firstLoaded = false;

      // action pad: nav group (back to boards) | board actions (rename/edit/delete)
      const boardbar = document.getElementById('boardbar');
      boardbar.style.display = 'flex';

      // Edit toggles ?edit=1 via the URL (a reload, matching the URL-driven
      // design). Label reflects the current state.
      const editBtn = boardbar.querySelector('button.edit');
      editBtn.innerHTML = editMode
        ? '<span class="ic">🔒</span> Lock'
        : '<span class="ic">✏️</span> Edit';
      editBtn.title = editMode ? 'Exit edit mode (view only)' : 'Edit this board';
      editBtn.addEventListener('click', () => {
        const next = new URLSearchParams(location.search);
        if (editMode) next.delete('edit');
        else next.set('edit', '1');
        location.search = next.toString();
      });

      // Rename the current board, then navigate to its new URL.
      boardbar.querySelector('button.rename').addEventListener('click', async () => {
        let existing = [];
        try {
          const data = await (await fetch('/api/diagrams', { cache: 'no-store' })).json();
          existing = (Array.isArray(data) ? data : []).map((d) => (typeof d === 'string' ? d : d.slug));
        } catch {}
        const to = await renameBoard(slug, existing);
        if (to) location.href = `/?d=${encodeURIComponent(to)}`;
      });

      boardbar.querySelector('button.dup').addEventListener('click', async () => {
        let existing = [];
        try {
          const data = await (await fetch('/api/diagrams', { cache: 'no-store' })).json();
          existing = (Array.isArray(data) ? data : []).map((d) => (typeof d === 'string' ? d : d.slug));
        } catch {}
        const to = await duplicateBoard(slug, existing);
        if (to) location.href = `/?d=${encodeURIComponent(to)}`;
      });

      boardbar.querySelector('button.del').addEventListener('click', async () => {
        if (!(await confirmDelete(slug))) return;
        try { await fetch(`/scene/${encodeURIComponent(slug)}.excalidraw`, { method: 'DELETE' }); } catch {}
        location.href = '/';
      });

      const setStatus = (kind, text) => {
        statusEl.className = kind === 'ok' ? '' : kind;
        statusText.textContent = text;
      };

      // ---- 404 overlay: surfaces when the board truly isn't on this server ----
      const notFoundEl = document.getElementById('notfound');
      const NOT_FOUND_GRACE_MS = 1500; // tolerate a slow first build before alarming
      let firstSeen404At = null;        // when the current run of 404s began
      let notFoundRendered = false;     // overlay built/visible?

      const escapeHtml = (s) =>
        String(s).replace(/[&<>"']/g, (c) =>
          ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

      function hideNotFound() {
        firstSeen404At = null;
        if (notFoundRendered) {
          notFoundEl.hidden = true;
          notFoundEl.innerHTML = '';
          notFoundRendered = false;
        }
      }

      async function showNotFound() {
        if (notFoundRendered) return; // build it once; it links elsewhere
        notFoundRendered = true;
        notFoundEl.hidden = false;
        notFoundEl.innerHTML =
          '<div class="panel">' +
            `<h1>No board named "<span class="slug">${escapeHtml(slug)}</span>" on this server.</h1>` +
            '<p class="meta" id="nf-workspace">Looking up this server’s workspace…</p>' +
            '<h2>Boards that do exist here</h2>' +
            '<ul id="nf-list"><li class="empty">Loading…</li></ul>' +
            '<p class="hint">Did the build run? Is another exgram server holding this port? See the workspace above.</p>' +
          '</div>';

        // Workspace (which folder this server actually serves) via /whoami.
        try {
          const who = await (await fetch('/whoami', { cache: 'no-store' })).json();
          const ws = document.getElementById('nf-workspace');
          if (ws) ws.innerHTML = 'This server is serving workspace: <code>' + escapeHtml(who.workspace) + '</code>';
        } catch {
          const ws = document.getElementById('nf-workspace');
          if (ws) ws.textContent = 'Could not reach /whoami on this server.';
        }

        // The boards that actually exist, as clickable links.
        try {
          const items = await (await fetch('/api/diagrams', { cache: 'no-store' })).json();
          const list = document.getElementById('nf-list');
          if (list) {
            // /api/diagrams now returns objects ({ slug, created, updated });
            // read item.slug (tolerating the legacy string shape).
            const slugs = (Array.isArray(items) ? items : []).map((d) => (typeof d === 'string' ? d : d.slug));
            list.innerHTML = slugs.length
              ? slugs.map((s) => `<li><a class="board" href="/?d=${encodeURIComponent(s)}">${escapeHtml(s)}</a></li>`).join('')
              : '<li class="empty">No boards on this server yet.</li>';
          }
        } catch {
          const list = document.getElementById('nf-list');
          if (list) list.innerHTML = '<li class="empty">Could not load the board list.</li>';
        }
      }

      // ---- persist hand edits (edit mode only) ----------------------------
      // In ?edit=1 the local canvas becomes the source of truth: Excalidraw's
      // onChange debounces a save (PUT the current scene back to the server) and
      // the poll loop below stops re-applying remote updates so it can't clobber
      // in-progress edits. The "Save" button forces an immediate flush.
      const savebar = document.getElementById('savebar');
      const saveState = document.getElementById('save-state');
      const saveStateText = document.getElementById('save-state-text');
      const setSaveState = (kind, text) => {
        // kind: '' (saved), 'dirty', 'saving', 'error'
        saveState.className = kind;
        saveStateText.textContent = text;
      };

      // Serialize the live canvas to the same shape lib/build.mjs writes, so a
      // saved scene is interchangeable with a built one.
      const serializeScene = () => JSON.stringify({
        type: 'excalidraw',
        version: 2,
        source: location.origin,
        elements: api.getSceneElements(),
        appState: { viewBackgroundColor: api.getAppState().viewBackgroundColor || '#ffffff' },
        files: api.getFiles(),
      });

      // Serialized snapshot of what's currently on disk for this board, so we can
      // skip saving when nothing actually changed. onChange fires on pure pan/zoom
      // too (which don't alter the serialized scene), so this elides no-op writes.
      let lastSavedScene = null;
      let saveInFlight = false, savePending = false;
      async function flushSave() {
        if (!api) return;
        if (saveInFlight) { savePending = true; return; } // coalesce overlapping saves
        const body = serializeScene();
        if (body === lastSavedScene) { // nothing changed (e.g. just a pan/zoom)
          setSaveState('', lastSavedScene ? `saved · ${new Date().toLocaleTimeString()}` : 'saved');
          return;
        }
        saveInFlight = true;
        setSaveState('saving', 'saving…');
        try {
          const res = await fetch(`/scene/${encodeURIComponent(slug)}.excalidraw`, {
            method: 'PUT', cache: 'no-store',
            headers: { 'Content-Type': 'application/json' },
            body,
          });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          lastSavedScene = body; // remember what we just persisted
          // Mirror what we just saved so the poll loop's diff doesn't treat our
          // own write as a remote change to re-apply.
          lastText = await (await fetch(`/scene/${encodeURIComponent(slug)}.excalidraw?t=${Date.now()}`, { cache: 'no-store' })).text();
          setSaveState('', `saved · ${new Date().toLocaleTimeString()}`);
        } catch (err) {
          setSaveState('error', 'save failed · retrying…');
        } finally {
          saveInFlight = false;
          if (savePending) { savePending = false; flushSave(); } // a change landed mid-save
        }
      }

      const SAVE_DEBOUNCE_MS = 800;
      let saveTimer = null;
      const scheduleSave = () => {
        setSaveState('dirty', 'unsaved…');
        clearTimeout(saveTimer);
        saveTimer = setTimeout(flushSave, SAVE_DEBOUNCE_MS);
      };

      if (editMode) {
        savebar.style.display = 'flex';
        document.getElementById('save-now').addEventListener('click', () => {
          clearTimeout(saveTimer);
          flushSave();
        });
      }

      function App() {
        return React.createElement(Excalidraw, {
          excalidrawAPI: (a) => { api = a; },
          theme: 'light',
          viewModeEnabled: !editMode, // read-only by default; ?edit=1 unlocks editing
          // Persist hand edits while editing. onChange fires a lot (incl. pure
          // pan/zoom), but firstLoaded gates it so the initial scene load and any
          // pre-load noise don't trigger a save before the user actually edits.
          onChange: editMode ? () => { if (firstLoaded) scheduleSave(); } : undefined,
          initialData: { appState: { viewBackgroundColor: '#ffffff' } },
          UIOptions: { canvasActions: { loadScene: true, export: { saveFileToDisk: true }, saveToActiveFile: false } },
        });
      }
      boot.remove();
      createRoot(document.getElementById('app')).render(React.createElement(App));

      // Poll fast on success; back off (capped) if the server vanishes so a dead
      // server doesn't spam the console every 0.5s.
      const POLL_MIN = 500, POLL_MAX = 5000;
      let pollDelay = POLL_MIN;

      async function poll() {
        try {
          const res = await fetch(`/scene/${encodeURIComponent(slug)}.excalidraw?t=${Date.now()}`, { cache: 'no-store' });
          pollDelay = POLL_MIN; // server responded -> back to fast polling
          if (res.status === 404) {
            setStatus('stale', `waiting for "${slug}"…`);
            // Only alarm once the board has *never* loaded and keeps 404ing past
            // the grace window; a normal slow first build keeps the "waiting" pill.
            if (!firstLoaded) {
              if (firstSeen404At === null) firstSeen404At = Date.now();
              else if (Date.now() - firstSeen404At >= NOT_FOUND_GRACE_MS) showNotFound();
            }
          } else if (res.ok) {
            hideNotFound(); // board appeared -> drop the error panel, draw normally
            const text = await res.text();
            // Only consume the text once the canvas API is ready, otherwise we'd
            // mark it "seen" before rendering and never draw it.
            // In edit mode, the local canvas is the source of truth once it has
            // loaded once: applying remote updates would clobber in-progress hand
            // edits (and fight the debounced save). So only auto-apply remote
            // scenes in read-only mode, or for the very first load in edit mode.
            const mayApply = !editMode || !firstLoaded;
            if (api && text && text !== lastText && mayApply) {
              lastText = text;
              const scene = JSON.parse(text);
              if (Array.isArray(scene.elements)) {
                // #19: restoreElements backfills any missing render fields (ids,
                // points, lineHeight, ...) so an incomplete element can't crash
                // hit-testing and blank the canvas. refreshDimensions:false keeps
                // authored text/box sizes. omit appState -> keep zoom/pan.
                const restored = restoreElements(scene.elements, null, { refreshDimensions: false });
                // #24: register embedded image bytes (node icons) BEFORE updateScene,
                // otherwise image elements reference a fileId Excalidraw doesn't have
                // yet and render as a broken-image placeholder. addFiles is idempotent.
                if (scene.files && typeof scene.files === 'object') {
                  const files = Object.values(scene.files).filter((f) => f && f.id && f.dataURL);
                  if (files.length) { try { api.addFiles(files); } catch {} }
                }
                api.updateScene({ elements: restored });
                if (!firstLoaded) {
                  firstLoaded = true;
                  setTimeout(() => {
                    try { api.scrollToContent(restored, { fitToContent: true, animate: false, viewportZoomFactor: 0.85 }); } catch {}
                    // Seed the saved-scene snapshot from the just-loaded board so the
                    // first onChange (and any pan/zoom) doesn't trigger a no-op write.
                    if (editMode) { try { lastSavedScene = serializeScene(); } catch {} }
                  }, 60);
                }
              }
            }
            // Status reflects mode: "live" follows the server; "editing" means
            // local edits win and are being persisted on change.
            setStatus('ok', editMode
              ? `exgram • ${slug} • editing · ${new Date().toLocaleTimeString()}`
              : `exgram • ${slug} • live · ${new Date().toLocaleTimeString()}`);
          }
        } catch (err) {
          pollDelay = Math.min(pollDelay * 2, POLL_MAX); // server down -> slow down
          setStatus('error', 'viewer offline · retrying…');
        } finally {
          setTimeout(poll, pollDelay);
        }
      }
      poll();
    }
  </script>
</body>
</html>
